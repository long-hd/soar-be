server:
  port: 48080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always      # which component is DOWN (db/redis)
      probes:
        enabled: true           # adds /health/liveness, /health/readiness
  health:
    db:
      enabled: true             # Postgres indicator
    redis:
      enabled: true             # Redis indicator

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:soar}
    username: ${POSTGRES_USER:soar}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0
      # password: ${REDIS_PASSWORD}  # Uncomment when Redis auth is enabled

logging:
  level:
    root: INFO
    com.hdl.soar: INFO
    org.hibernate.SQL: WARN
    org.flywaydb: INFO
  file:
    name: /app/logs/soar.log
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 7

# Soar prod overrides
soar:
  web:
    admin-ui:
      url: https://soar.haduylong.com  # change to https://soar.<domain>
  security:
    mock-enable: false
  tenant:
    enable: true
  captcha:
    enable: true
  user:
    init-password: "${SOAR_INIT_PASSWORD:123456}"


--- #################### Pay ####################

soar:
  pay:
    order-notify-url: https://soar.haduylong.com/app-api/pay/notify/order
    order-no-prefix: P
    mock-enable: false
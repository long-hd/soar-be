management:
  tracing:
    sampling:
      probability: 1.0

spring:
  application:
    name: soar-server

  profiles:
    active: local

  # Servlet
  servlet:
    multipart:
      max-file-size: 16MB
      max-request-size: 32MB

  # Jackson — ISO-8601 for Instant/LocalDate (e.g. "2024-01-15T10:30:00Z")
  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  # Cache
  cache:
    type: REDIS
    redis:
      time-to-live: 1h

  # JPA / Hibernate
  jpa:
    open-in-view: false # EntityManager created at @Transactional boundary, not request start
    hibernate:
      ddl-auto: validate # Flyway manages schema; Hibernate only validates entity ↔ table mapping
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Flyway
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
    table: sys_flyway_histories

  # Disable Spring Data Redis repositories (not used, using RedisTemplate directly)
  data:
    redis:
      repositories:
        enabled: false

# Server
server:
  servlet:
    encoding:
      enabled: true
      charset: UTF-8
      force: true

# SpringDoc
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui
  default-flat-param-object: true

--- #################### Scheduler ####################

spring:
  quartz:
    job-store-type: jdbc          # schedules live in qrtz_* -> survive restart, ready for clustering
    jdbc:
      initialize-schema: never    # Flyway is the only owner of the schema (migration V1_1_5)
    properties:
      org:
        quartz:
          scheduler:
            instanceName: SoarScheduler
            instanceId: AUTO      # each node generates its own id - required when clustered
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            isClustered: true     # nodes contend for a DB lock -> a job runs once no matter how many nodes
            clusterCheckinInterval: 15000
            useProperties: false
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 10


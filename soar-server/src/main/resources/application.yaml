# Soar custom properties

soar:
  web:
    admin-ui:
      url: http://localhost:5173
  security:
    mock-enable: false
  tenant:
    enable: true
    ignore-caches:
      - user_role_ids
      - permission_menu_ids
      - oauth_client
  captcha:
    enable: false
  user:
    init-password: "123456"

--- #################### WebSocket ####################

soar:
  websocket:
    enable: true          # default true
    path: /infra/ws       # handshake path
    sender-type: local    # local (single node) | redis (multi node). Default local.
    sender-rabbitmq:
      exchange: ${spring.application.name}-websocket-exchange
      queue: ${spring.application.name}-websocket-queue
    sender-kafka:
      topic: ${spring.application.name}-websocket
      consumer-group: ${spring.application.name}-websocket-consumer

--- #################### Pay ####################

soar:
  pay:
    order-notify-url: http://localhost:48080/admin-api/pay/notify/order   # dev; prod = https://<domain>/app-api/pay/notify/order
    order-no-prefix: P
    mock-enable: false